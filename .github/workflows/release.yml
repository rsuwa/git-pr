name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    name: validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bats shellcheck
      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: brew install bats-core shellcheck
      - name: Syntax
        run: |
          bash -n git-pr
          bash -n install.sh
          bash -n script/build-release-assets
          bash -n script/verify-release-assets
          bash -n test/test_helper.bash
      - name: ShellCheck
        run: shellcheck git-pr install.sh script/build-release-assets script/verify-release-assets test/test_helper.bash test/*.bats
      - name: Tests
        run: bats test
      - name: Build release assets
        run: ./script/build-release-assets "$RUNNER_TEMP/git-pr-release"
      - name: Verify release assets
        run: ./script/verify-release-assets "$RUNNER_TEMP/git-pr-release" "$GITHUB_REF_NAME"

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build release assets
        run: ./script/build-release-assets "$RUNNER_TEMP/git-pr-release"
      - name: Verify release assets
        run: ./script/verify-release-assets "$RUNNER_TEMP/git-pr-release" "$GITHUB_REF_NAME"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/git-pr-release/git-pr" \
            "$RUNNER_TEMP/git-pr-release/install.sh" \
            "$RUNNER_TEMP/git-pr-release/SHA256SUMS" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes "See CHANGELOG.md for release notes."
